# Secret-scanning configuration.
#
# `useDefault` keeps gitleaks' entire built-in ruleset — this file only *adds* a narrow
# exception, it does not replace anything. A config that silently disabled the default
# rules would turn the CI secret scan into a check that always passes, which is worse than
# having no scan at all.
[extend]
useDefault = true

# The lab has no credentials of any kind: no accounts, no API keys, no third-party tokens.
# Every finding here is therefore expected to be a false positive on documentation, and
# each one gets its own entry rather than a blanket path exclusion.
[[allowlists]]
description = """
The example Sec-WebSocket-Key in the README's proxy-verification command.

`dGhlIHNhbXBsZSBub25jZQ==` is base64 for the ASCII string "the sample nonce" — the
canonical example from RFC 6455 section 1.3. It is not a credential: a Sec-WebSocket-Key
is a per-handshake random value the client generates in the clear, and the protocol
requires the server to echo a hash of it back. gitleaks' `generic-api-key` rule flags it
on entropy alone (4.17).

The README now uses an obviously-inert value instead, but this entry has to stay: the RFC
nonce is in this repository's git history, so a scan over full history still reaches it.
Scoped with `condition = "AND"` so it allows exactly this string in exactly this file, and
nothing else anywhere.
"""
condition = "AND"
paths = ['''^README\.md$''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
